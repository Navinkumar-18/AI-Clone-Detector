# =============================================================================
# VoiceGuard — Unified Model & System Configuration
# =============================================================================
# This is the SINGLE SOURCE OF TRUTH for all configuration values.
# All backend code, evaluation scripts, tests, and documentation must
# reference this file via voiceguard_config.py — no independent threshold
# constants are permitted elsewhere.
#
# Version: threshold-v2
# Last reviewed: 2026-09-07
# =============================================================================

# ---------------------------------------------------------------------------
# Active Model Selection ('wav2vec2' or 'wavlm_mlp')
# ---------------------------------------------------------------------------
active_model: wav2vec2

# ---------------------------------------------------------------------------
# Model Backends Registry
# ---------------------------------------------------------------------------
models:
  wav2vec2:
    backend: wav2vec2
    model_id: "garystafford/wav2vec2-deepfake-voice-detector"
    revision: "c66306024a7ede0be291e9c4558b37634782dc4e"
    version: "voiceguard-v1"
    score_type: "uncalibrated_softmax_score"
    thresholds:
      version: "threshold-v2"
      spoof_threshold: 0.30
      high_risk_threshold: 0.85
  wavlm_mlp:
    backend: wavlm_mlp
    model_id: "microsoft/wavlm-base"
    revision: "efa81aae7ff777e464159e0f877d54eac5b84f81"
    version: "research-mlp-v1"
    checkpoint_path: "models/best_mlp_wavlm_base.pt"
    checkpoint_sha256: "f7e518d57e8f96ec6c5c34b8ebb2ecd78c91ba67e7c260287a367aeb53816d2f"
    score_type: "uncalibrated_sigmoid_score"
    thresholds:
      version: "wavlm-v1"
      spoof_threshold: 0.30
      high_risk_threshold: 0.85

# ---------------------------------------------------------------------------
# Legacy Model Block (for backward-compatibility)
# ---------------------------------------------------------------------------
model:
  name: "garystafford/wav2vec2-deepfake-voice-detector"
  revision: "c66306024a7ede0be291e9c4558b37634782dc4e"
  version: "voiceguard-v1"

# ---------------------------------------------------------------------------
# Audio
# ---------------------------------------------------------------------------
audio:
  sample_rate: 16000
  minimum_duration_seconds: 0.5
  maximum_duration_seconds: 60.0
  allowed_extensions:
    - ".wav"
    - ".flac"
    - ".mp3"
    - ".ogg"
    - ".m4a"
    - ".aac"
    - ".webm"
    - ".mp4"
    - ".opus"

# ---------------------------------------------------------------------------
# Default / Fallback Thresholds
# ---------------------------------------------------------------------------
thresholds:
  version: "threshold-v2"
  spoof_threshold: 0.30
  high_risk_threshold: 0.85

# ---------------------------------------------------------------------------
# Risk aggregation (client-side / risk_aggregator.py)
# ---------------------------------------------------------------------------
risk_aggregation:
  ema_alpha: 0.3
  persistent_high_windows: 2
  cooldown_windows: 3
  medium_ema_threshold: 0.40
  high_ema_threshold: 0.85

# ---------------------------------------------------------------------------
# Audio quality thresholds
# ---------------------------------------------------------------------------
audio_quality:
  rms_silence_threshold: 0.003
  minimum_voiced_ratio: 0.10
  maximum_clipping_ratio: 0.05
  poor_snr_threshold_db: 5.0

# ---------------------------------------------------------------------------
# Server / API
# ---------------------------------------------------------------------------
server:
  maximum_upload_bytes: 10485760  # 10 MB
  maximum_concurrency: 4
  request_timeout_seconds: 30
  live_request_timeout_seconds: 15
  rate_limit_requests_per_minute: 60

# ---------------------------------------------------------------------------
# Security
# ---------------------------------------------------------------------------
security:
  demo_mode: false
  allowed_cors_origins:
    - "http://localhost"
    - "http://127.0.0.1"
    - "https://localhost"
    - "https://127.0.0.1"
